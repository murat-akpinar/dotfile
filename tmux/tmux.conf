# prefix: C-Space (nadir komutlar: c yeni window, ? liste, [ copy-mode)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- prefix'siz, tek akor ---

# split: Alt + vim yonleri, ayni dizinde acilir
bind -n M-h split-window -hb -c "#{pane_current_path}"
bind -n M-l split-window -h  -c "#{pane_current_path}"
bind -n M-k split-window -vb -c "#{pane_current_path}"
bind -n M-j split-window -v  -c "#{pane_current_path}"

# pane gezinme: oklar
bind -n C-Left  select-pane -L
bind -n C-Down  select-pane -D
bind -n C-Up    select-pane -U
bind -n C-Right select-pane -R

bind -n M-x confirm-before -p "pane kapansin mi? (y/n)" kill-pane
bind -n M-d detach

bind r source-file ~/.tmux.conf \; display "reloaded"
