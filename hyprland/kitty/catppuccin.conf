# vim:ft=kitty

## name:     Catppuccin Mocha — Mauve
## based on: https://catppuccin.com/palette (Mocha)
## blurb:    Mauve-accented Mocha. Every value below is an official Mocha color.


# The basic colors
foreground              #cdd6f4
background              #1e1e2e

# Selection: tint the background only, keep syntax colors intact
selection_foreground    none
selection_background    #585b70

# Cursor colors
cursor                  #cba6f7
cursor_text_color       #1e1e2e

# Scrollbar colors
scrollbar_handle_color  #6c7086
scrollbar_track_color   #313244

# URL color when hovering with mouse
url_color               #b4befe

# Kitty window border colors
active_border_color     #cba6f7
inactive_border_color   #45475a
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #7f849c
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #94e2d5

# The 16 terminal colors
# normal = base tone, bright = its lighter sibling from the same palette family

# black: surface1 / overlay0
color0  #45475a
color8  #6c7086

# red: red / maroon
color1  #f38ba8
color9  #eba0ac

# green: green
color2  #a6e3a1
color10 #a6e3a1

# yellow: peach / yellow
color3  #fab387
color11 #f9e2af

# blue: blue / lavender
color4  #89b4fa
color12 #b4befe

# magenta: mauve / pink
color5  #cba6f7
color13 #f5c2e7

# cyan: teal / sky
color6  #94e2d5
color14 #89dceb

# white: subtext1 / text
color7  #bac2de
color15 #cdd6f4
